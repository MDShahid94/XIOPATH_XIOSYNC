# ==================================================
# XIOPATH — CI/CD Pipeline (Phase P.3)
# ==================================================
# Triggers on push/PR to main. Runs lint, tests, Docker build.
# ==================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  DOCKER_IMAGE: xiopath

jobs:
  # ── Lint & Type Check ────────────────────────────
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check all Python syntax
        run: python -m compileall -q api core colab deploy tests

      - name: Check imports
        run: |
          python -c "
          from core.bundle_format import BundleManifest, serialize_bundle, deserialize_bundle
          from core.environment_manager import EnvironmentManager
          from core.environment_executor import EnvironmentExecutor
          from core.tenant_context import TenantContext
          from core.workflow_orchestrator import WorkflowOrchestrator
          from core.master_workflow_agent import MasterWorkflowAgent
          from core.intent_indexer import IntentIndexer
          from api.routers.marketplace import router
          from api.routers.workflows import router
          print('All imports OK')
          "

  # ── Tests ────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          XIOPATH_JWT_SECRET: test-secret-key-for-ci-that-is-not-for-production
          XIOPATH_ENV: test
        run: |
          python -m pytest tests/ -v --tb=short \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── Docker Build ─────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          tags: ${{ env.DOCKER_IMAGE }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          tags: ${{ env.DOCKER_IMAGE }}-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify API container starts
        run: |
          docker build --target api -t xiopath-api:test .
          docker run -d --name api-test \
            -e JWT_SECRET_KEY=test-key \
            -e ENVIRONMENT=test \
            -p 8000:8000 \
            xiopath-api:test
          sleep 5
          curl -f http://localhost:8000/ || (docker logs api-test && exit 1)
          docker stop api-test
          docker rm api-test

  # ── Security Scan ────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in code
        run: |
          # Basic check — no hardcoded keys/passwords
          if grep -rn "password\s*=\s*['\"]" --include="*.py" .; then
            echo "WARNING: Possible hardcoded passwords found"
          fi
          # Check no .env files committed
          if [ -f .env ]; then
            echo "ERROR: .env file should not be committed"
            exit 1
          fi

      - name: Check .gitignore covers sensitive files
        run: |
          grep -q "\.env" .gitignore
          grep -q "vault_key" .gitignore
          grep -q "secrets.json" .gitignore
          echo "✅ Sensitive files in .gitignore"
